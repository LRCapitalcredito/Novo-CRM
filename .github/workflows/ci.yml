name: Verificar LR Capital
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Verificar permissões no emulador local
        run: npx --yes firebase-tools@15.31.0 emulators:exec --project demo-lr-capital-v2 --config firebase.test.json --only firestore "node --test tests/firestore.rules.integration.mjs"
